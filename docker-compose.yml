services:
  mcp-server:
    build: ./mcp-server
    ports:
      - "8001:8001"

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL}
      - MCP_SERVER_URL=http://mcp-server:8001
    depends_on:
      - mcp-server
